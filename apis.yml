name: Slingshot
description: 'Slingshot is a self-custody, multi-chain DeFi application and wallet founded in 2020 and
  headquartered in San Francisco, letting retail users search, send, receive, and swap tens of thousands
  of cryptocurrencies at aggregated best prices with 0% swap fees. It is available on Web, iOS, and Android
  with bridging support across Ethereum Mainnet, Arbitrum, Arbitrum Nova, Base, Optimism, Polygon, BNB
  Chain, and Canto. Backed by Electric Capital, Slingshot combined centralized-exchange ease with the
  openness of decentralized exchanges. NOTE: Slingshot announced it is sunsetting, advising users to export
  their private keys before February 28, 2026; its GitHub organization was archived in January 2026. This
  profile documents a consumer DeFi product that exposes no public developer API surface.'
